[project]
name = "sustainmetric-idx"
version = "0.1.0"
description = "SustainMetric IDX: The Algorithmic Green Auditor FastMCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0"
]

[project.scripts]
sustainmetric-idx = "sustainmetric.server:main"


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sustainmetric"]
